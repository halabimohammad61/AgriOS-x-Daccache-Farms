services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: agrios
      POSTGRES_DB: agrios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agrios_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrios -d agrios"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  agrios_pg:
